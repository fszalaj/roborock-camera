move:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: vacuum
          integration: roborock
    velocity:
      required: true
      selector:
        number:
          min: -0.3
          max: 0.3
          step: 0.05
          unit_of_measurement: m/s
    rotation:
      required: true
      selector:
        number:
          min: -179
          max: 179
          unit_of_measurement: "°"
    duration:
      default: 500
      selector:
        number:
          min: 100
          max: 3000
          unit_of_measurement: ms
stop_moving:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: vacuum
          integration: roborock
patrol:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: vacuum
          integration: roborock
    map_index:
      default: 0
      selector:
        number:
          min: 0
          max: 3
    points:
      required: true
      example: "[[25500, 25500], [27000, 26000]]"
      selector:
        object:
